        <!-- SECTION: ATTENDANCE -->
        <section id="sec-attendance">
          <div class="manager-card">
            <div class="section-title" style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px;">
              <span>Verified Registrations</span>
              <div style="display:flex; flex-wrap: wrap; gap:12px; align-items:center;">
                <button class="btn-mini" onclick="window.openAddAttendeeModal()" aria-label="Add attendee manually" style="background: var(--accent); color: #000; border-color: var(--accent);">＋ Add Attendee</button>
                <button class="btn-mini" onclick="exportAttendees()" aria-label="Export attendee database">⬇ Export DB</button>
                <button class="btn-mini" onclick="backupDataToJSON('registrations')" aria-label="Backup Database">💾 Backup</button>
                <button class="btn-mini" onclick="triggerRestoreJSON('registrations')" aria-label="Restore Database">📂 Restore</button>
                <span class="badge badge-accent" id="attendee-count" aria-live="polite" style="white-space: normal; text-align: center;">0 registered</span>
                <span class="badge" id="scanned-count-total" style="background:var(--bg-3); color:var(--ink); white-space: normal; text-align: center; border: 1px solid var(--line-strong);" aria-live="polite">0 Scanned</span>
                <span class="badge" id="badge-count-attendee" style="background:var(--accent); color:#000; white-space: normal; text-align: center;" aria-live="polite">0 Attendee Badge</span>
                <span class="badge" id="badge-count-speaker" style="background:#9C27B0; color:#fff; white-space: normal; text-align: center; border-color:#9C27B0;" aria-live="polite">0 Speaker Badge</span>
              </div>
            </div>
            <!-- Bulk Action Bar (collapsible) -->
            <div style="margin-bottom: 16px; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden;">
              <div id="bulk-actions-header" style="padding: 10px 12px; background: rgba(255, 255, 255, 0.03); display: flex; justify-content: space-between; align-items: center; cursor: pointer;" onclick="window.toggleBulkActionsPanel()" role="button" tabindex="0" aria-expanded="false" aria-controls="bulk-actions">
                <span style="font-size: 13px; color: var(--ink-dim); font-weight: 600;">Bulk Actions</span>
                <span id="bulk-actions-chevron" aria-hidden="true" style="font-size: 12px; color: var(--ink-dim); transition: transform 0.3s ease; display: inline-block;">▾</span>
              </div>
              <div id="bulk-actions" style="display: none; padding: 12px; gap: 8px; align-items: center; flex-wrap: wrap;">
                <button class="bulk-action-btn bulk-action-btn-primary" onclick="sendBulkTickets()" id="btn-send-bulk-tickets">Final Passes (QR)</button>
                <button class="bulk-action-btn bulk-action-btn-danger" onclick="sendBulkRejections()" id="btn-send-bulk-rejections">House Full</button>
                <button class="bulk-action-btn" onclick="sendBulkEntryReminder()" id="btn-send-bulk-entry-reminder">🎟️ Entry Reminder</button>
                <button class="bulk-action-btn" onclick="sendBulkFoodInfo()" id="btn-send-bulk-food">🍔 Food Info</button>
                <button class="bulk-action-btn" onclick="sendBulkLocationGuide()" id="btn-send-bulk-location">📍 Location Guide</button>
                <button class="bulk-action-btn" onclick="sendBulkCertificates()" id="btn-send-bulk-certificate">🏆 Certificate</button>
                <div id="bulk-progress" style="display: none; font-size: 12px; font-weight: 600; color: var(--accent); margin-left: auto;">Processing 0 / 0...</div>
              </div>
            </div>
            <!-- Tabs -->
            <div style="margin-bottom: 16px; display: flex; gap: 8px; border-bottom: 1px solid var(--line-strong); padding-bottom: 16px; margin-top: 8px;">
              <button id="tab-all" class="btn-mini" style="background: var(--accent); color: #000; padding: 6px 16px; font-weight: 600; border: none; border-radius: 6px; cursor: pointer; transition: all 0.2s ease;" onclick="window.setTabFilter('')">All List</button>
              <button id="tab-pass" class="btn-mini" style="background: var(--bg-3); color: var(--ink); padding: 6px 16px; font-weight: 600; border: none; border-radius: 6px; cursor: pointer; transition: all 0.2s ease;" onclick="window.setTabFilter('ticket_sent')">Final Pass Sent</button>
              <button id="tab-speaker" class="btn-mini" style="background: var(--bg-3); color: var(--ink); padding: 6px 16px; font-weight: 600; border: none; border-radius: 6px; cursor: pointer; transition: all 0.2s ease;" onclick="window.setTabFilter('speaker')">Speakers / Keynotes</button>
              <button id="tab-reject" class="btn-mini" style="background: var(--bg-3); color: var(--ink); padding: 6px 16px; font-weight: 600; border: none; border-radius: 6px; cursor: pointer; transition: all 0.2s ease;" onclick="window.setTabFilter('rejected')">House Full Sent</button>
            </div>
            <!-- Search & Filters -->
            <div style="margin-bottom: 16px; display: flex; gap: 12px; align-items: center;">
              <div style="position: relative; flex: 1;">
                <span style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-dim); font-size: 14px;">🔍</span>
                <input type="text" id="attendee-search" placeholder="Search attendees by name, organization, designation, email, mobile..." oninput="window.debouncedFilterAttendees()" style="width: 100%; padding: 8px 12px 8px 36px; background: var(--bg-3); border: 1px solid var(--line-strong); border-radius: 6px; color: var(--ink); font-size: 13px;">
              </div>
              <button class="btn-reset" onclick="window.resetAllFilters()" style="font-size: 13px; padding: 8px 16px;">Reset Filters</button>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th style="width: 40px; text-align: center;"><input type="checkbox" id="selectAllAttendees" onchange="toggleAllAttendees(this)"></th>
                    <th>Name</th>
                    <th>Status</th>
                    <th style="min-width: 90px;">Role</th>
                    <th>Organization</th>
                    <th>Designation</th>
                    <th>Email</th>
                    <th>Mobile</th>
                    <th>LinkedIn</th>
                    <th>Registered</th>
                    <th>Pass</th>
                    <th style="text-align: right;">Action</th>
                  </tr>
                  <tr class="filter-row">
                    <th></th>
                    <th><input type="text" id="col-filter-name" placeholder="Filter Name..." oninput="window.debouncedFilterAttendees()" style="width:100%; padding: 4px 8px; background: var(--bg-3); border: 1px solid var(--line-strong); border-radius: 4px; color: var(--ink); font-size: 11px;"></th>
                    <th>
                      <select id="col-filter-status" onchange="window.filterAttendees()" style="width:100%; padding: 4px 8px; background: var(--bg-3); border: 1px solid var(--line-strong); border-radius: 4px; color: var(--ink); font-size: 11px; height: 26px;">
                        <option value="">All</option>
                        <option value="verified">Verified</option>
                        <option value="present">Present</option>
                        <option value="ticket_sent">Pass Sent</option>
                        <option value="rejected">Rejected</option>
                      </select>
                    </th>
                    <th>
                      <select id="col-filter-role" onchange="window.filterAttendees()" style="width:100%; min-width: 90px; padding: 4px 8px; background: var(--bg-3); border: 1px solid var(--line-strong); border-radius: 4px; color: var(--ink); font-size: 11px; height: 26px;">
                        <option value="">All Roles</option>
                        <option value="Attendee">Attendee</option>
                        <option value="Keynote">Keynote</option>
                        <option value="Speaker">Speaker</option>
                        <option value="Panelist">Panelist</option>
                        <option value="Organiser">Organiser</option>
                        <option value="Chief Guest">Chief Guest</option>
                      </select>
                    </th>
                    <th><input type="text" id="col-filter-org" placeholder="Filter Org..." oninput="window.debouncedFilterAttendees()" style="width:100%; padding: 4px 8px; background: var(--bg-3); border: 1px solid var(--line-strong); border-radius: 4px; color: var(--ink); font-size: 11px;"></th>
                    <th><input type="text" id="col-filter-desig" placeholder="Filter Desig..." oninput="window.debouncedFilterAttendees()" style="width:100%; padding: 4px 8px; background: var(--bg-3); border: 1px solid var(--line-strong); border-radius: 4px; color: var(--ink); font-size: 11px;"></th>
                    <th><input type="text" id="col-filter-email" placeholder="Filter Email..." oninput="window.debouncedFilterAttendees()" style="width:100%; padding: 4px 8px; background: var(--bg-3); border: 1px solid var(--line-strong); border-radius: 4px; color: var(--ink); font-size: 11px;"></th>
                    <th><input type="text" id="col-filter-mobile" placeholder="Filter Mobile..." oninput="window.debouncedFilterAttendees()" style="width:100%; padding: 4px 8px; background: var(--bg-3); border: 1px solid var(--line-strong); border-radius: 4px; color: var(--ink); font-size: 11px;"></th>
                    <th></th>
                    <th></th>
                    <th></th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="attendee-table">
                  <!-- Dynamic -->
                </tbody>
              </table>
            </div>
            <div style="margin-top: 16px; font-size: 11px; color: var(--ink-dim); text-align: right;">
              Primary Contact: <span style="color: var(--accent);">elevateqa@sdettech.com</span>
            </div>
          </div>
        </section>
